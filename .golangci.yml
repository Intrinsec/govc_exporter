version: "2"

run:
  modules-download-mode: vendor

linters:
  settings:
    errcheck:
      exclude-functions:
        # Used in HTTP handlers, any error is handled by the server itself.
        - (net/http.ResponseWriter).Write
        - fmt.Fprintf
  exclusions:
    rules:
      - path: _test.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
